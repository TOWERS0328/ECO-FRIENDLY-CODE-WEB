<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito de Premios</title>
    <link rel="stylesheet" href="cartRecycle.css">

    <!-- Iconos Flaticon -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <div class="carrito-header">

        <!-- Puntos del estudiante -->
        <div class="puntos-estudiante">
            <i class="fi fi-rr-badge-check"></i>
            <span id="puntosEstudiante">0 pts</span>
        </div>

        <!-- Título centrado -->
        <h1>Mi Carrito</h1>

        <!-- Botón volver -->
        <button class="btn-volver" onclick="window.location.href='redeemPoints.html'">
            <i class="fi fi-rr-arrow-left"></i> Volver
        </button>
    </div>

    <!-- CONTENEDOR DE ITEMS -->
    <div id="cart-items"></div>

    <!-- TOTAL PUNTOS A GASTAR + BOTÓN FINAL -->
    <div class="acciones-carrito">
        <div class="total-puntos-carrito">
            <i class="fi fi-rr-badge-check"></i>
            <span id="totalPuntos">0 pts</span>
        </div>

        <button class="btn-acopio" id="btnFinalizarCanje">
            <i class="fi fi-rr-check"></i> Finalizar Canje
        </button>
    </div>

    <!-- JS -->
    <script src="cartRedeempoints.js"></script>

</body>
</html>

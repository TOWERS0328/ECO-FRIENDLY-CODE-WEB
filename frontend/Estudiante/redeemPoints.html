<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Friendly Code - Canjear Puntos</title>

  <link rel="stylesheet" href="../GOBAL-CSS/logoEcoBtnInicio.css">
  <link rel="stylesheet" href="../GOBAL-CSS/style-dashboard.css" />
  <link rel="stylesheet" href="../Estudiante/Sidebar_Estudiantes/GLOBAL-SIDEBAR.css">
  <link rel="stylesheet" href="styleRedeemPoints.css" />
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

<body>

  <header>
    <div class="left">
      <div class="menu-container">
        <div class="menu">
          <div></div>
          <div></div>
          <div></div>
        </div>
      </div>


      <div class="brand">
        <a href="../home/index.html" class="logo">
          <h1><span>ECO</span> FRIENDLY</h1>
          <p>CODE</p>
        </a>
      </div>
    </div>

    <div class="right">
      <div class="user-points-cart">
        <div class="points">
          <i class="fi fi-rr-badge-check"></i>
          <span id="userPoints">0</span> pts
        </div>
        <div class="cart-residuos" id="cart-residuos">
          <i class="fi fi-rr-shopping-cart"></i>
          <span id="cart-residuos-count">0</span>
        </div>
      </div>
      <img alt="img-user" class="user" id="header-avatar" style="cursor:pointer;">
    </div>

  <div class="sidebar" id="sidebar">
    <nav>
      <ul>
        <li><a href="viewinicial.html"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>

        <li><a href="recycle.html"><i class="fi fi-rr-recycle"></i><span class="text">Reciclar</span></a></li>

      </ul>
    </nav>
  </div>

  <main class="main-content">
    <section class="catalogo">
      <div class="header-catalogo">
        <h1><i class="fi fi-rr-gift"></i> Catálogo de Premios y Recompensas</h1>
        <p>Usa tus puntos acumulados para canjear estos productos.</p>
      </div>

      <div class="search-bar">
        <input id="searchPremio" type="text" placeholder="Buscar premio por nombre..." />
        <button id="btnBuscarPremio"><i class="fi fi-rr-search"></i></button>
      </div>

      <div class="productos" id="contenedorPremios"></div>
    </section>
  </main>

  <script src="../Estudiante/Sidebar_Estudiantes/GLOBAL-SIDEBAR.js"></script>

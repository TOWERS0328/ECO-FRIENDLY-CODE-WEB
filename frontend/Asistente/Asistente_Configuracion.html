<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - Asistente | EcoFriendly Code</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./Asistente_Sidebar/Sidebar_Asistente.css">
    <link rel="stylesheet" href="Asistente_Configuracion.css">

</head>

<body>

<!-- ============ NAVBAR ============ -->
<header>
    <div class="left">
        <div class="menu-container">
            <div class="menu" id="menu">
                <div></div><div></div><div></div>
            </div>
        </div>

        <div class="brand">
            <a href="../home/index.html" class="logo">
                <h1><span>ECO</span> FRIENDLY</h1>
                <p>CODE</p>
            </a>
        </div>
    </div>

    <div class="right">
        <a href="#" class="btn-cerrar-sesion">
            <i class="fi fi-rr-exit"></i>
        </a>
        <img id="navFoto" src="" alt="img-user" class="user">
    </div>
</header>


<!-- ============ SIDEBAR ============ -->
<div class="sidebar" id="sidebar">
    <nav>
        <ul>
            <li><a href="Asistente_Dashboard.html"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>
            <li><a href="Asistente_Entrega_Premio.html"><i class="fi fi-rr-gift"></i><span class="text">Entrega de Premio</span></a></li>
            <li><a href="Asistente_Verificacion_Residuos.html"><i class="fi fi-rr-recycle"></i><span class="text">Verificación Residuos</span></a></li>
            <li><a href="Asistente_Configuracion.html" class="active"><i class="fi fi-rr-settings"></i><span class="text">Configuración</span></a></li>
        </ul>
    </nav>
</div>


<main class="main">

    <h1 class="titulo-configuracion"><i class="fi fi-rr-settings"></i> Configuración</h1>
    <p class="subtitulo">Ajustes del asistente y preferencias del sistema</p>

    <!-- CARD PRINCIPAL -->
    <section class="configuracion-card">

        <h2 class="titulo-seccion text-center">Perfil del Asistente</h2>

        <!-- FOTO + BOTÓN -->
        <div class="foto-contenedor">
            <img id="perfilFoto" src="" alt="Foto de perfil" class="foto-perfil">
            <button class="btn-cambiar-foto" id="btnCambiarFoto">
                <i class="fi fi-rr-camera"></i> Cambiar foto
            </button>
            <input type="file" id="inputFoto" accept="image/*" style="display:none;">
        </div>

        <!-- FORMULARIO -->
        <form id="formPerfil" class="formulario">

            <div class="campo">
                <label for="perfilCedula">Cédula</label>
                <input type="text" id="perfilCedula" readonly>
            </div>

            <div class="campo">
                <label for="perfilNombre">Nombre</label>
                <input type="text" id="perfilNombre">
            </div>

            <div class="campo">
                <label for="perfilApellido">Apellido</label>
                <input type="text" id="perfilApellido">
            </div>

            <div class="campo">
                <label for="perfilCorreo">Correo</label>
                <input type="email" id="perfilCorreo">
            </div>

            <div class="campo">
                <label for="perfilGenero">Género</label>
                <input type="text" id="perfilGenero">
            </div>

            <div class="campo">
                <label for="perfilArea">Área</label>
                <input type="text" id="perfilArea">
            </div>

            <hr>

            <button type="button" id="btn-actualizar" class="btn-guardar">
                <i class="fi fi-rr-edit"></i> Actualizar Datos
            </button>

        </form>

    </section>

</main>


<!-- ============ SCRIPT ============ -->
<script src="./Asistente_Sidebar/Sidebar_Asistente.js"></script>
<script src="Asistente_Configuracion.js"></script>

</body>
</html>

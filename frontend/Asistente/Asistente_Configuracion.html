<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - Asistente | EcoFriendly Code</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flaticon -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Sidebar -->
    <link rel="stylesheet" href="./Asistente_Sidebar/Sidebar_Asistente.css">

    <!-- Configuración CSS -->
    <link rel="stylesheet" href="Asistente_Configuracion.css">

</head>

<body>

<!-- ============ NAVBAR ============ -->
<header>
    <div class="left">

        <div class="menu-container">
            <div class="menu" id="menu">
                <div></div><div></div><div></div>
            </div>
        </div>

        <div class="brand">
            <a href="../home/index.html" class="logo">
                <h1><span>ECO</span> FRIENDLY</h1>
                <p>CODE</p>
            </a>
        </div>

    </div>

    <div class="right">
        <a href="#" class="btn-cerrar-sesion">
            <i class="fi fi-rr-exit"></i>
        </a>
        <img src="../../Img/9434619.jpg" alt="img-user" class="user">
    </div>
</header>


<!-- ============ SIDEBAR ============ -->
<div class="sidebar" id="sidebar">
    <nav>
        <ul>
            <li><a href="Asistente_Dashboard.html"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>
            <li><a href="Asistente_Entrega_Premio.html"><i class="fi fi-rr-gift"></i><span class="text">Entrega de Premio</span></a></li>
            <li><a href="Asistente_Verificacion_Residuos.html"><i class="fi fi-rr-recycle"></i><span class="text">Verificación Residuos</span></a></li>
            <li><a href="Asistente_Reportes.html"><i class="fi fi-rr-document"></i><span class="text">Reportes</span></a></li>
            <li><a href="Asistente_Configuracion.html" class="active"><i class="fi fi-rr-settings"></i><span class="text">Configuración</span></a></li>
        </ul>
    </nav>
</div>


<!-- ============ MAIN CONFIGURACIÓN ============ -->
<main class="main">

    <h1 class="titulo mt-4"><i class="fi fi-rr-settings"></i> Configuración</h1>
    <p class="subtitulo">Ajustes del asistente y preferencias del sistema</p>


    <!-- ================= PERFIL ================= -->
    <section class="config-card mt-4">
        <h2><i class="fi fi-rr-user"></i> Perfil del Asistente</h2>

        <div class="profile-box">
            <img src="../../Img/9434619.jpg" id="preview-img" class="profile-img" alt="Foto de perfil">

            <label for="profile-input" class="profile-btn">
                <i class="fi fi-rr-camera"></i> Cambiar foto
            </label>
            <input type="file" id="profile-input" accept="image/*" hidden>
        </div>

        <form class="form-config mt-3">
            <label>Nombre completo</label>
            <input type="text" class="form-control" value="Asistente Operativo" readonly>

            <label>Correo electrónico</label>
            <input type="email" class="form-control" value="asistente@eco.com" readonly>
        </form>
    </section>


    <!-- ================= PREFERENCIAS ================= -->
    <section class="config-card mt-4">
        <h2><i class="fi fi-rr-eclipse"></i> Preferencias generales</h2>

        <div class="row mt-3">

            <div class="col-md-6">
                <label class="form-label">Modo oscuro</label>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox">
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Idioma</label>
                <select class="form-select">
                    <option>Español</option>
                    <option>Inglés</option>
                </select>
            </div>

        </div>
    </section>


    <!-- ================= PERSONALIZACIÓN ================= -->
    <section class="config-card mt-4 mb-5">
        <h2><i class="fi fi-rr-palette"></i> Personalización del panel</h2>

        <label class="form-label mt-3">Color principal</label>
        <input type="color" value="#00b050" class="form-control form-control-color">

        <button class="btn btn-success mt-3">
            <i class="fi fi-rr-disk"></i> Guardar configuración
        </button>
    </section>

</main>



<!-- ============ SCRIPT ============ -->
<script src="./Asistente_Sidebar/Sidebar_Asistente.js"></script>

<script>
    // Vista previa foto perfil
    document.getElementById('profile-input')
        .addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('preview-img').src = URL.createObjectURL(file);
            }
        });
</script>

</body>
</html>

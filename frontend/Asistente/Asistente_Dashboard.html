<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Asistente - EcoFriendly Code</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Flaticon Icons -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Sidebar CSS -->
    <link rel="stylesheet" href="./Asistente_Sidebar/Sidebar_Asistente.css">

    <!-- Dashboard CSS -->
    <link rel="stylesheet" href="Asistente_Dashboard.css">
</head>
<body>

<header>
    <div class="left">
        <div class="menu-container">
            <div class="menu" id="menu">
                <div></div><div></div><div></div>
            </div>
        </div>
        <div class="brand">
            <a href="../home/index.html" class="logo">
                <h1><span>ECO</span> FRIENDLY</h1>
                <p>CODE</p>
            </a>
        </div>
    </div>

    <div class="right">
        <a href="#" class="btn-cerrar-sesion">
            <i class="fi fi-rr-exit"></i>
        </a>
        <img src="" alt="img-user" class="user">
    </div>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <nav>
        <ul>
            <li><a href="Asistente_Dashboard.html" class="active"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>
            <li><a href="Asistente_Entrega_Premio.html"><i class="fi fi-rr-gift"></i><span class="text">Entrega de Premio</span></a></li>
            <li><a href="Asistente_Verificacion_Residuos.html"><i class="fi fi-rr-recycle"></i><span class="text">Verificación de Residuos</span></a></li>
            <li><a href="Asistente_Configuracion.html"><i class="fi fi-rr-settings"></i><span class="text">Configuración</span></a></li>
        </ul>
    </nav>
</div>

<!-- CONTENIDO DEL DASHBOARD -->
<main class="main">

    <h1 class="titulo mt-4">Panel del Asistente</h1>
    <p class="subtitulo">Resumen rápido de tareas pendientes</p>

    <!-- CARDS PRINCIPALES -->
    <div class="row g-4 mt-2">

        <!-- Residuos pendientes -->
        <div class="col-md-6">
            <div class="card-dashboard shadow-sm">
                <i class="fi fi-rr-recycle icon"></i>
                <h3>Residuos Pendientes</h3>
                <p class="numero" id="residuosPendientes">0</p>
            </div>
        </div>

        <!-- Premios por entregar -->
        <div class="col-md-6">
            <div class="card-dashboard shadow-sm">
                <i class="fi fi-rr-gift icon"></i>
                <h3>Premios por Entregar</h3>
                <p class="numero" id="premiosPendientes">0</p>
            </div>
        </div>

    </div>

    <!-- TABLA RESUMEN -->
    <div class="actividad-card shadow-sm mt-5 p-4">
        <h2>Resumen</h2>
        <table class="table mt-3">
            <thead>
                <tr>
                    <th>Residuos Validados</th>
                    <th>Premios Entregados</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td id="residuosValidados">0</td>
                    <td id="premiosEntregados">0</td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="./Asistente_Sidebar/Sidebar_Asistente.js"></script>
<script src="Asistente_Dashboard.js"></script>


</body>
</html>

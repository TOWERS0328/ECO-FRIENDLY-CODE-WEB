<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Acopios | Eco Friendly</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Flaticon Icons -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Sidebar -->
    <link rel="stylesheet" href="./Asistente_Sidebar/Sidebar_Asistente.css">

    <!-- CSS propio -->
    <link rel="stylesheet" href="Asistente_Verificacion_Residuos.css">
</head>

<body>

    <!-- NAV SUPERIOR -->
    <header>
        <div class="left">
            <div class="menu-container">
                <div class="menu" id="menu">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="brand">
                <a href="../home/index.html" class="logo">
                    <h1><span>ECO</span> FRIENDLY</h1>
                    <p>CODE</p>
                </a>
            </div>
        </div>

        <div class="right">
            <a href="#" class="btn-cerrar-sesion"><i class="fi fi-rr-exit"></i></a>
          <img id="headerFoto" src="" class="user">
        </div>
    </header>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <nav>
            <ul>
                <li><a href="Asistente_Dashboard.html"><i class="fi fi-rr-home"></i> <span>Inicio</span></a></li>
                <li><a href="Asistente_Entrega_Premio.html"><i class="fi fi-rr-gift"></i> <span>Entrega de
                            Premio</span></a></li>
                <li>
                    <a href="Asistente_Verificacion_Acopios.html" class="active">
                        <i class="fi fi-rr-recycle"></i> <span>Verificación de Acopios</span>
                    </a>
                </li>
                <li><a href="Asistente_Configuracion.html"><i class="fi fi-rr-settings"></i>
                        <span>Configuración</span></a></li>
            </ul>
        </nav>
    </div>

    <!-- CONTENIDO -->
    <main class="main">
        <h1 class="titulo">Verificación de Acopios</h1>
        <p class="subtitulo">Listado completo de acopios registrados por los estudiantes.</p>

        <!-- BUSCADOR -->
        <div class="buscador-container">
            <input type="text" id="buscador" placeholder="Buscar estudiante, residuo, etc..." onkeyup="buscarEnTabla()">
            <i class="fi fi-rr-search"></i>
        </div>

        <!-- FILTRO ESTADO -->
        <div class="filtro-estado">
            <select id="filtroEstado" onchange="filtrarTabla()">
                <option value="todos">Todos</option>
                <option value="pendiente">Pendiente</option>
                <option value="validado">Validado</option>
                <option value="rechazado">Rechazado</option>
            </select>
            <i class="fi fi-rr-filter"></i>
        </div>

        <!-- TABLA DE ACOPIOS -->
        <div class="tabla-container">
            <table id="tabla-acopios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Estudiante</th>
                        <th>Cédula</th>
                        <th>Puntos</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se cargará dinámicamente con JS -->
                </tbody>
            </table>
        </div>

        <!-- MODAL DE DETALLES -->
<div id="modalAcopio" class="modal">
    <div class="modal-content">

        <!-- ❗ X alineada a la izquierda como pediste -->
        <span id="btnCerrarModalAcopio" class="btn-cerrar-x">X</span>

        <h3>Estudiante: <span id="modal-estudiante"></span></h3>

        <p>Cédula: <span id="modal-cedula"></span></p>
        <p>Fecha: <span id="modal-fecha"></span></p>
        <p>Estado: <span id="modal-estado"></span></p>
        <p>Puntos totales: <span id="modal-puntos"></span></p>

        <!-- Residuos en negrita -->
        <div id="modal-residuos" class="modal-residuos"></div>

        <!-- Botones pequeños y centrados -->
        <div class="modal-buttons">
            <button id="btnValidarModal">Validar</button>
            <button id="btnRechazarModal">Rechazar</button>
        </div>

    </div>
</div>


    </main>

    <script src="./Asistente_Sidebar/Sidebar_Asistente.js"></script>
    <script src="Asistente_Verificacion_Residuos.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuraciones | Eco Friendly Code</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Flaticon Icons -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <!-- UIcons Flaticon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons/css/all/all.css">

    <!-- Iconos Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

 <link rel="stylesheet" href="Sidebar_EntidadRecicladora/SiderbarEntidad.css">
 <link rel="stylesheet" href="settings.css">

</head>

<body>


<!-- ============================= HEADER ============================= -->
<header>
    <div class="left">
        <!-- Botón Hamburguesa -->
        <div class="menu-container" id="menu-btn">
            <div class="menu">
                <div></div><div></div><div></div>
            </div>
        </div>

        <!-- LOGO -->
        <div class="brand">
            <a href="../home/index.html" class="logo">
                <h1><span>ECO</span> FRIENDLY</h1>
                <p>CODE</p>
            </a>
        </div>
    </div>

    <div class="right">
        <a href="recicladora_mensajes.html" class="btn-mensajes"><i class="fi fi-rr-comment-alt"></i></a>
        <a href="#" class="btn-cerrar-sesion"><i class="fi fi-rr-exit"></i></a>
        <img src="../../Img/9434619.jpg" class="user">
    </div>
</header>

<!-- ============================= SIDEBAR ============================= -->
<aside class="sidebar" id="sidebar">
    <nav>
        <ul>
            <li><a href="EntidadRecicladora_dashboard.html"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>
            <li><a href="settings.html"><i class="fi fi-rr-settings"></i><span class="text">Configuración</span></a></li>
            <li><a href="EntidadRecicladora_reports.html"><i class="fi fi-rr-document"></i><span class="text">Reportes</span></a></li>
        </ul>
    </nav>
</aside>


<!-- =========================================================
                            MAIN
========================================================= -->
<main class="main-content">

    <!-- Título -->
    <div class="top-bar">
        <h2><i class="bi bi-sliders"></i> Configuración del Sistema</h2>
    </div>

    <!-- Perfil -->
    <section class="settings-section">
        <h3><i class="bi bi-person-circle"></i> Perfil de la Entidad Recicladora</h3>

        <div class="profile-container">
            <img src="https://i.pravatar.cc/150?img=12" id="preview-img" alt="Foto de perfil">

            <label for="profile-input" class="upload-btn">
                <i class="bi bi-camera-fill"></i> Cambiar foto
            </label>

            <input type="file" id="profile-input" accept="image/*" hidden>
        </div>

        <form class="settings-form">
            <label>Nombre completo</label>
            <input type="text" value="Carlos Mendoza" readonly>

            <label>Correo electrónico</label>
            <input type="email" value="entidadrecicladora@eco.com" readonly>
        </form>
    </section>

    <!-- Preferencias -->
    <section class="settings-section">
        <h3><i class="bi bi-brightness-high"></i> Preferencias del Sistema</h3>

        <div class="toggle-group">
            <label>
                <span><i class="bi bi-moon"></i> Modo oscuro</span>
                <input type="checkbox" id="dark-mode-toggle">
            </label>

            <label>
                <span><i class="bi bi-translate"></i> Idioma</span>
                <select id="language-select">
                    <option>Español</option>
                    <option>Inglés</option>
                </select>
            </label>
        </div>
    </section>

    <!-- Personalización -->
    <section class="settings-section">
        <h3><i class="bi bi-palette"></i> Personalización del panel</h3>

        <label>Color del panel principal</label>
        <input type="color" value="#00b050" class="color-picker" id="color-picker">

        <button class="btn green" id="save-preferences">
            <i class="bi bi-save"></i> Guardar preferencias
        </button>
    </section>

</main>




<script src="Sidebar_EntidadRecicladora/SiderbarEntidad.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Entidad Recicladora | ECO Friendly Code</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Flaticon Icons -->
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">

    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css">

    <!-- Estilos -->
    <link rel="stylesheet" href="EntidadRecicladora_dashboard.css">
    <link rel="stylesheet" href="Sidebar_EntidadRecicladora/SiderbarEntidad.css">
</head>

<body>

<!-- ============================= HEADER ============================= -->
<header>
    <div class="left">
        <!-- Botón Hamburguesa -->
        <div class="menu-container" id="menu-btn">
            <div class="menu">
                <div></div><div></div><div></div>
            </div>
        </div>

        <!-- LOGO -->
        <div class="brand">
            <a href="../home/index.html" class="logo">
                <h1><span>ECO</span> FRIENDLY</h1>
                <p>CODE</p>
            </a>
        </div>
    </div>

    <div class="right">
        <a href="recicladora_mensajes.html" class="btn-mensajes"><i class="fi fi-rr-comment-alt"></i></a>
        <a href="#" class="btn-cerrar-sesion"><i class="fi fi-rr-exit"></i></a>
        <img src="../../Img/9434619.jpg" class="user">
    </div>
</header>

<!-- ============================= SIDEBAR ============================= -->
<aside class="sidebar" id="sidebar">
    <nav>
        <ul>
            <li><a href="EntidadRecicladora_dashboard.html"><i class="fi fi-rr-home"></i><span class="text">Inicio</span></a></li>
            <li><a href="settings.html"><i class="fi fi-rr-settings"></i><span class="text">Configuración</span></a></li>
            <li><a href="EntidadRecicladora_reports.html"><i class="fi fi-rr-document"></i><span class="text">Reportes</span></a></li>
        </ul>
    </nav>
</aside>

<!-- ============================= MAIN ============================= -->
<main class="main">

    <div class="d-flex justify-content-between align-items-center">
        <h1><i class="fi fi-rr-stats"></i> Panel Entidad Recicladora</h1>
        <input type="text" class="form-control search-bar" placeholder="Buscar...">
    </div>

    <div class="stats">
        <div class="stat-card">
            <i class="fi fi-rr-users"></i>
            <h5>Usuarios Atendidos</h5>
            <p>—</p>
        </div>

        <div class="stat-card">
            <i class="fi fi-rr-recycle"></i>
            <h5>Kg Procesados</h5>
            <p>—</p>
        </div>

        <div class="stat-card">
            <i class="fi fi-rr-document"></i>
            <h5>Reportes Emitidos</h5>
            <p>—</p>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-lg-6">
            <div class="chart-card">
                <h6>Material Reciclado Mensual</h6>
                <canvas id="materialChart"></canvas>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="chart-card">
                <h6>Tipos de Material Procesado</h6>
                <canvas id="typesChart"></canvas>
            </div>
        </div>

    </div>

    <div class="data-section mt-4">
        <h5>Registro General</h5>
        <table id="ecoTable" class="table table-striped"></table>
    </div>

</main>

<script src="Sidebar_EntidadRecicladora/SiderbarEntidad.js"></script>

</body>
</html>
